<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markov Decision Process</title>
<style>
  :root{
    --ink:#1F1F1F;
    --act:#3B82F6;
    --rew:#EF4444;
    --vpi:#047857;
    --vstar:#E98FA9;   /* оптимальное: нежно-розовый, в тон капкейку */
    /* набор «под LaTeX»: Computer Modern, если он есть в системе, иначе близкие засечные.
       Times стоит выше STIX Two Text: у STIX в Safari курсивные греческие (α, β)
       обрезаются по ширине знакоместа */
    --math:"Latin Modern Roman","CMU Serif","TeX Gyre Termes",
           "Cambria","Times New Roman",Times,"STIX Two Text","XITS",serif;
  }
  .it{font-style:italic}
  .sup{font-size:.72em}
  .num{font-style:normal}          /* числа прямым начертанием, как в матрежиме */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  .wrap{max-width:1340px;margin:0 auto;padding:16px 20px 26px;}

  .topbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:10px}
  .steps{display:flex;flex-wrap:wrap;gap:9px}

  /* все элементы шапки — одной высоты, толщины и с общим шагом */
  .steps button,.sbsToggle,.gammaBox{
    height:44px;display:flex;align-items:center;box-sizing:border-box;
    padding:0 18px;border:1.7px solid #d8d8d8;border-radius:999px;background:#fff;
    font:inherit;font-size:clamp(14px,1.3vw,17px);color:#4a4a4a;white-space:nowrap;
    transition:background .2s,color .2s,border-color .2s,box-shadow .2s;
  }
  .gammaBox{gap:10px;padding-right:8px}
  .gammaBox label{color:#5a5a5a;white-space:nowrap}
  .gammaBox label b{color:var(--ink);font-weight:500}
  .gammaBox label b.mathit{font-family:var(--math);font-style:italic;font-size:1.15em}
  .gammaBox input[type=range]{width:clamp(90px,11vw,140px);accent-color:var(--ink);cursor:pointer}
  .gammaBox input[type=number]{width:80px;height:27px;font:inherit;font-size:inherit;
    font-variant-numeric:tabular-nums;padding:0 6px;border:1.4px solid #dcdcdc;border-radius:6px;
    color:var(--ink);background:#fff}
  .gammaBox input[type=number]:focus{outline:none;border-color:var(--ink)}
  .steps button{cursor:pointer}
  .steps button:hover{border-color:#9a9a9a;color:var(--ink)}
  .steps button .n{opacity:.5;margin-right:6px;font-variant-numeric:tabular-nums}
  .steps button.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .steps button.on .n{opacity:.6}

  .sbsToggle{gap:8px;cursor:pointer}
  .sbsToggle:hover{border-color:#9a9a9a;color:var(--ink)}
  .sbsToggle input{accent-color:var(--ink);cursor:pointer;margin:0}
  body.sbs .sbsToggle{border-color:var(--ink);color:var(--ink);font-weight:600}

  .stage{position:relative;width:100%;aspect-ratio:1200/590;background:#fff}
  #svg{display:block;width:100%;height:100%;overflow:visible}

  /* ---- states ---- */
  .oval{fill:#fff;stroke:var(--ink);stroke-width:2.6}
  .stlabel{font-family:var(--math);font-style:italic;font-size:34px;font-weight:500;
           fill:var(--ink);text-anchor:middle;dominant-baseline:central;
           pointer-events:none;transition:transform .25s ease}
  .stlabel.up{transform:translateY(-15px)}      /* освобождает место под ценность */
  .node{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .18s ease,opacity .4s ease}
  .node:hover{transform:scale(1.05)}
  .node:hover .oval{stroke-width:3.4}
  .node.picked .oval{stroke-width:3.8}

  /* ---- actions: the agent's choice ---- */
  .chain{transition:opacity .45s ease}
  .chain.dim{opacity:.13}
  .seg{fill:none;stroke:var(--act);stroke-width:2.6;stroke-linecap:round;
       transition:stroke-width .22s ease,stroke .25s ease}
  .dot{fill:var(--act);stroke:#fff;stroke-width:1.2;stroke-linejoin:round;transition:fill .25s ease}
  .alabel{font-family:var(--math);font-style:italic;font-size:31px;font-weight:500;fill:var(--act);
          text-anchor:middle;dominant-baseline:central;
          pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4.5;stroke-linejoin:round;
          transition:font-size .2s ease,fill .25s ease}

  /* ---- transitions: the environment's outcome ---- */
  .env{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:butt;
       transition:stroke-width .22s ease,stroke .25s ease,opacity .5s ease}
  .hit{fill:none;stroke:transparent;stroke-width:20;cursor:pointer}

  .rlabel,.plabel{font-family:var(--math);text-anchor:middle;dominant-baseline:central;
          pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4;stroke-linejoin:round;
          transition:font-size .3s ease,font-weight .3s ease,opacity .45s ease}
  .rlabel{font-size:23px;font-weight:400;fill:var(--rew)}
  .rlabel.hot{font-size:27px;font-weight:700}
  .plabel{font-size:22.5px;font-weight:400;fill:var(--ink)}
  .plabel.hot{font-size:26.5px;font-weight:700}
  .pilabel{font-family:var(--math);font-size:21px;font-weight:500;fill:var(--act);
          text-anchor:middle;dominant-baseline:central;
          pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4.5;stroke-linejoin:round}
  .vlabel{font-family:var(--math);font-size:22px;font-weight:500;text-anchor:middle;dominant-baseline:central;
          pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4.5;stroke-linejoin:round}
  .vlabel.pi{fill:var(--vpi)}
  .vlabel.star{fill:var(--vstar)}
  .vlabel.inside{font-size:19.5px;stroke-width:3}   /* ценность внутри овала */

  .fade{opacity:0;transition:opacity .5s ease}
  .fade.show{opacity:1}

  .seg.hover{stroke-width:4.4}
  .env.hover{stroke-width:4.4}
  .alabel.hover{font-size:35px}

  .halo{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-dasharray:6 6;opacity:0;transition:opacity .5s ease}
  .halo.show{opacity:.45}
  .env.stoch{stroke-width:4}
  .seg.stoch{stroke-width:4}

  /* подсвечивается только выбор агента — стрелки среды остаются чёрными */
  .chain.opt .seg{stroke:var(--vstar);stroke-width:6}
  .chain.opt .dot{fill:var(--vstar)}
  .chain.opt .alabel{fill:var(--vstar)}

  #cakeArt{cursor:pointer;transition:opacity .45s ease}

  /* без dominant-baseline:central: WebKit центрирует каждый шрифтовый фрагмент
     по своим метрикам, и смешанные строки «пляшут»; общая базовая линия задана через y */
  .legend text{font-size:17px;fill:#4f4f4f}
  .legend text tspan.mf{font-family:var(--math);font-size:1.13em;fill:#3c3c3c}
  .legend text.k{font-family:var(--math);font-size:19px;font-weight:600;text-anchor:middle}
  .legend text.k.rew{fill:var(--rew)}
  .legend text.k.prob{fill:var(--ink)}

  /* ---- пошаговое вычисление ---- */
  .qlabel{font-family:var(--math);font-size:18.5px;font-weight:500;text-anchor:middle;dominant-baseline:central;
          pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4.5;stroke-linejoin:round;
          opacity:0;transition:opacity .35s ease}
  .qlabel.show{opacity:1}
  .qlabel.pi{fill:var(--vpi)}
  .qlabel.star{fill:var(--vstar)}

  #sbsPanel{display:none;margin-top:6px;border-top:1.5px solid #ededed;padding-top:12px}
  body.sbs #sbsPanel{display:block}
  .sbs-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;margin-bottom:12px}
  .sbs-ctl{display:flex;gap:6px}
  .sbs-ctl button{font:inherit;font-size:17px;min-width:46px;padding:7px 15px;border-radius:8px;
    border:1.4px solid #dcdcdc;background:#fff;color:#5a5a5a;cursor:pointer;transition:border-color .2s,color .2s}
  .sbs-ctl button:hover:not(:disabled){border-color:#9a9a9a;color:var(--ink)}
  .sbs-ctl button:disabled{opacity:.4;cursor:default}
  .sbs-mode button{min-width:0}
  .sbs-mode button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .sbs-phase{font-size:17.5px}
  .sbs-phase b{font-weight:650}
  .sbs-phase .k{font-family:var(--math);font-style:italic}
  .sbs-delta{margin-left:auto;font-family:var(--math);font-size:16.5px;color:#8a8a8a}

  /* уравнение Беллмана, по которому идёт счёт */
  .sbs-law{border:1.3px solid #ececec;border-radius:10px;padding:10px 15px 11px;margin-bottom:14px;background:#fcfcfc}
  .sbs-law .name{font-size:clamp(14px,1.3vw,17px);color:#8a8a8a;margin-left:auto;white-space:nowrap}
  .sbs-law .eqs{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 38px}
  .sbs-law .eq{font-family:var(--math);font-size:21px;line-height:1.62;color:#3c3c3c;
    transition:opacity .25s ease}
  .sbs-law .eq.dim{opacity:.35}
  .sbs-law .eq.act{color:var(--ink);font-weight:600}

  /* формулы — строками, новое сверху */
  .sbs-rows{display:flex;flex-direction:column}
  .sbs-row{display:flex;align-items:baseline;gap:16px;padding:10px 12px;border-radius:9px;
    border:1.3px solid transparent;border-bottom-color:#f0f0f0;
    font-family:var(--math);font-size:19px;line-height:1.5}
  .sbs-row .s{flex:none;width:94px;font-size:25px;font-style:italic;font-weight:500}
  .sbs-row .s.term{font-size:19px}
  .sbs-row .body{display:flex;flex-wrap:wrap;gap:4px 30px;align-items:baseline}
  .sbs-row .q{color:#4a4a4a}
  .sbs-row .v{font-weight:700}
  .sbs-row.mode-pi .v,.sbs-row.mode-pi .from{color:var(--vpi)}
  .sbs-row.mode-star .v,.sbs-row.mode-star .from{color:var(--vstar)}
  .sbs-row .from{font-weight:600}
  .sbs-row.hot{border-color:#dcdcdc;background:#fafafa}
  .sbs-row .note{color:#9a9a9a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:clamp(14px,1.3vw,17px)}

  /* числа скрыты под «?» и открываются кнопками строки */
  .sbs-row .tok{color:#c2c2c2;font-weight:600;transition:color .15s ease}
  .sbs-row .tok.on{color:inherit;font-weight:inherit}
  .sbs-row .tok.from.on{font-weight:600}
  .sbs-row.mode-pi .tok.from.on{color:var(--vpi)}
  .sbs-row.mode-star .tok.from.on{color:var(--vstar)}
  .sbs-row .tok.res.on{font-weight:700}
  .sbs-row .rowctl{margin-left:auto;display:flex;gap:4px;flex:none;align-self:center}
  .sbs-row .rowctl button{font:inherit;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:15px;padding:5px 12px;border-radius:7px;border:1.3px solid #e0e0e0;background:#fff;
    color:#8a8a8a;cursor:pointer;transition:border-color .2s,color .2s}
  .sbs-row .rowctl button:hover:not(:disabled){border-color:#9a9a9a;color:var(--ink)}
  .sbs-row .rowctl button:disabled{opacity:.35;cursor:default}

  #calc i{font-style:italic}
  #calc sup{font-size:.72em}

  /* ---- calculation panel ---- */
  #calc{position:absolute;right:.5%;top:1.5%;width:clamp(232px,26%,318px);
    background:rgba(255,255,255,.975);border:1.4px solid #e0e0e0;border-radius:11px;
    box-shadow:0 8px 26px rgba(0,0,0,.12);padding:12px 13px 13px;
    font-size:clamp(11.4px,1.1vw,14px);line-height:1.55;z-index:6;
    opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
  #calc.on{opacity:1;transform:none;pointer-events:auto}
  #calc h3{margin:0 0 2px;font-size:1.08em;font-weight:650}
  #calc .sub{color:#8a8a8a;font-size:.92em;margin-bottom:7px}
  #calc .blk{margin-top:7px}
  #calc .blk .h{font-weight:650;margin-bottom:2px}
  #calc .blk.pi .h{color:var(--vpi)}
  #calc .blk.st .h{color:var(--vstar)}
  #calc .ln{font-family:var(--math);font-size:1.06em;line-height:1.5}
  #calc .res{font-weight:700}
  #calc .blk.pi .res{color:var(--vpi)}
  #calc .blk.st .res{color:var(--vstar)}
  #calc .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:17px;line-height:1;
    color:#b0b0b0;cursor:pointer;padding:2px 4px}
  #calc .x:hover{color:var(--ink)}
  @media (max-width:620px){ #calc{width:58%;font-size:10.3px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="steps" id="steps"></div>
    <label class="sbsToggle" for="sbsOn"><input type="checkbox" id="sbsOn"> step-by-step</label>
    <div class="gammaBox">
      <label for="gammaNum">discount factor <b class="mathit">γ</b></label>
      <input id="gammaRange" type="range" min="0" max="1" step="0.01" value="0.9" aria-label="discount factor">
      <input id="gammaNum" type="number" min="0" max="1" step="0.01" value="0.9">
    </div>
  </div>

  <div class="stage" id="stage">
    <svg id="svg" viewBox="0 0 1200 590" role="img" aria-label="Markov decision process graph">
      <defs>
        <!-- Наконечник. refX сдвинут к основанию: линия обрывается внутри треугольника,
             где он ещё шире штриха, поэтому у кончика ничего не торчит. -->
        <marker id="ah" viewBox="0 0 13 10" refX="4.5" refY="5" markerWidth="13" markerHeight="10"
                markerUnits="userSpaceOnUse" orient="auto">
          <path d="M0.6 0.6 L12.4 5 L0.6 9.4 Z" fill="#1F1F1F"/>
        </marker>

        <linearGradient id="cakeBody" x1="512" y1="390" x2="512" y2="755" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FFD9B5"/>
          <stop offset="1" stop-color="#F3B786"/>
        </linearGradient>
        <linearGradient id="cakeFilling" x1="258" y1="598" x2="765" y2="598" gradientUnits="userSpaceOnUse">
          <stop stop-color="#E94E77"/>
          <stop offset=".5" stop-color="#FF7896"/>
          <stop offset="1" stop-color="#D9406B"/>
        </linearGradient>
        <radialGradient id="cherry" cx="0" cy="0" r="1"
                        gradientTransform="translate(554 251) rotate(57) scale(122)" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FF6B72"/>
          <stop offset=".42" stop-color="#E92F48"/>
          <stop offset="1" stop-color="#A20F2D"/>
        </radialGradient>
        <filter id="cakeShadow" x="140" y="245" width="744" height="615"
                filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#9E5365" flood-opacity=".2"/>
        </filter>
        <filter id="plateShadow" x="120" y="722" width="784" height="140"
                filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="17"/>
        </filter>

        <linearGradient id="cupWrapper" x1="512" y1="502" x2="512" y2="804" gradientUnits="userSpaceOnUse">
          <stop stop-color="#F8BBC7"/>
          <stop offset="1" stop-color="#E98FA9"/>
        </linearGradient>
        <linearGradient id="cupCake" x1="512" y1="438" x2="512" y2="560" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FFD9B5"/>
          <stop offset="1" stop-color="#F3B786"/>
        </linearGradient>
        <radialGradient id="cupCherry" cx="0" cy="0" r="1"
                        gradientTransform="translate(541 154) rotate(55) scale(93)" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FF6B72"/>
          <stop offset=".44" stop-color="#E92F48"/>
          <stop offset="1" stop-color="#A20F2D"/>
        </radialGradient>
        <filter id="cupShadow" x="210" y="144" width="604" height="725"
                filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#9E5365" flood-opacity=".2"/>
        </filter>
        <filter id="cupGround" x="250" y="770" width="524" height="100"
                filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
          <feGaussianBlur stdDeviation="17"/>
        </filter>
        <clipPath id="cupClip">
          <path d="M286 512h452l-48 258c-9 48-365 48-356 0l-48-258z"/>
        </clipPath>
      </defs>

      <g id="gChains"></g>

      <!-- terminal state: the cake -->
      <g id="gCake">
        <g id="cakeArt">
          <circle cx="787" cy="286" r="18" fill="#FFD7C9"/>
          <circle cx="218" cy="654" r="13" fill="#F3B6C6"/>
          <path d="M218 294l9 23 23 9-23 9-9 23-9-23-23-9 23-9 9-23z" fill="#F5BE87"/>
          <path d="M824 590l7 18 18 7-18 7-7 18-7-18-18-7 18-7 7-18z" fill="#E9A0B5"/>

          <ellipse cx="512" cy="815" rx="333" ry="43" fill="#A95570" opacity=".13" filter="url(#plateShadow)"/>
          <ellipse cx="512" cy="764" rx="335" ry="76" fill="#F8BBC7"/>
          <ellipse cx="512" cy="749" rx="296" ry="48" fill="#FFF4F2"/>

          <g filter="url(#cakeShadow)">
            <path d="M250 365h524v345c0 30-117 54-262 54s-262-24-262-54V365z" fill="url(#cakeBody)"/>
            <ellipse cx="512" cy="365" rx="262" ry="92" fill="#FFD9B5"/>
            <path d="M250 489c75 28 164 42 262 42s187-14 262-42v51c-75 29-164 43-262 43s-187-14-262-43v-51z" fill="url(#cakeFilling)"/>
            <path d="M250 566c75 28 164 42 262 42s187-14 262-42v51c-75 29-164 43-262 43s-187-14-262-43v-51z" fill="url(#cakeFilling)"/>
            <path d="M250 617c75 29 164 43 262 43s187-14 262-43v18c-75 29-164 43-262 43s-187-14-262-43v-18z" fill="#F7C499" opacity=".7"/>
            <path d="M250 344c0 47 117 85 262 85s262-38 262-85v93c-18 12-38 18-60 18-42 0-46-45-84-45-42 0-44 76-86 76-45 0-43-91-88-91-43 0-44 66-85 66-28 0-46-28-79-28-15 0-29 5-42 13v-102z" fill="#FFF0F3"/>
            <ellipse cx="512" cy="344" rx="262" ry="85" fill="#FFF0F3" stroke="#FADFE4" stroke-width="10"/>
            <path d="M321 702.39c58.1 13.74 122.34 20.61 191 20.61s132.9-6.87 191-20.61" fill="none"
                  stroke="#FFD9B8" stroke-width="32" stroke-linecap="round" opacity=".76"/>
            <path d="M289 523c14.57 4.26 29.58 8.06 45 11.39" fill="none"
                  stroke="#FFF1D9" stroke-width="22" stroke-linecap="round" opacity=".6"/>
          </g>

          <path d="M555 304c17-65 57-111 111-137" fill="none" stroke="#3D7B50" stroke-width="18" stroke-linecap="round"/>
          <path d="M628 186c29-29 66-32 93-16-15 34-51 53-91 39" fill="#63A85E"/>
          <path d="M630 192c25 3 49 1 70-9" fill="none" stroke="#3D7B50" stroke-width="7" stroke-linecap="round" opacity=".8"/>
          <circle cx="550" cy="279" r="76" fill="url(#cherry)"/>
          <ellipse cx="525" cy="250" rx="23" ry="15" transform="rotate(-33 525 250)" fill="#FFB2AB" opacity=".72"/>
          <path d="M486 316c28 35 79 44 116 17" fill="none" stroke="#7E0D27" stroke-width="9" stroke-linecap="round" opacity=".28"/>

          <rect id="cakeHit" x="177" y="150" width="670" height="708" fill="transparent"/>
        </g>

        <!-- second terminal state: the consolation cupcake -->
        <g id="cupcakeArt">
          <circle cx="234" cy="621" r="14" fill="#F3B6C6"/>
          <circle cx="786" cy="375" r="17" fill="#FFD7C9"/>
          <path d="M234 330l9 23 23 9-23 9-9 23-9-23-23-9 23-9 9-23z" fill="#F5BE87"/>
          <path d="M802 601l7 18 18 7-18 7-7 18-7-18-18-7 18-7 7-18z" fill="#E9A0B5"/>

          <ellipse cx="512" cy="816" rx="230" ry="35" fill="#A95570" opacity=".14" filter="url(#cupGround)"/>

          <g filter="url(#cupShadow)">
            <path d="M286 512h452l-48 258c-9 48-347 48-356 0l-48-258z" fill="url(#cupWrapper)"/>
            <g clip-path="url(#cupClip)" fill="none" stroke="#FFD6DE" stroke-width="18" stroke-linecap="round" opacity=".62">
              <path d="M323 520l43 257"/>
              <path d="M390 516l25 278"/>
              <path d="M460 514l8 287"/>
              <path d="M564 514l-8 287"/>
              <path d="M634 516l-25 278"/>
              <path d="M701 520l-43 257"/>
            </g>
            <ellipse cx="512" cy="512" rx="226" ry="67" fill="#E98FA9"/>
            <ellipse cx="512" cy="494" rx="210" ry="61" fill="url(#cupCake)"/>
            <path d="M338 505c50 27 109 41 174 41s124-14 174-41" fill="none"
                  stroke="#FFE6C8" stroke-width="18" stroke-linecap="round" opacity=".7"/>
            <path d="M294 514c-18-31 7-67 66-82-25-35 0-74 60-88-18-33 7-68 55-80-11-35 10-66 49-72 37 8 55 39 43 72 46 11 69 47 48 80 57 13 82 53 51 89 59 14 84 50 64 81-71 27-141 40-218 40s-147-13-218-40z"
                  fill="#FFF0F3" stroke="#FADFE4" stroke-width="8" stroke-linejoin="round"/>
            <path d="M390 432c72 23 158 23 237 0" fill="none" stroke="#FADFE4" stroke-width="15" stroke-linecap="round" opacity=".9"/>
            <path d="M438 344c47 16 101 16 151 0" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity=".55"/>
            <path d="M483 266c20 7 42 8 64 1" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity=".55"/>
          </g>

          <path d="M544 199c13-53 48-92 96-115" fill="none" stroke="#3D7B50" stroke-width="16" stroke-linecap="round"/>
          <path d="M611 101c25-25 58-29 82-14-14 30-45 47-80 35" fill="#63A85E"/>
          <path d="M613 106c22 3 43 1 62-8" fill="none" stroke="#3D7B50" stroke-width="6" stroke-linecap="round" opacity=".8"/>
          <circle cx="540" cy="179" r="59" fill="url(#cupCherry)"/>
          <ellipse cx="520" cy="157" rx="18" ry="12" transform="rotate(-33 520 157)" fill="#FFB2AB" opacity=".72"/>

        <text x="60" y="72"><tspan class="mf"><tspan class="it">π</tspan>(<tspan class="it">a</tspan>|<tspan class="it">s</tspan>)</tspan> action</text>

        <line x1="18" y1="96" x2="43" y2="96" stroke="#1F1F1F" stroke-width="2.6" marker-end="url(#ah)"/>
        <text x="60" y="102"><tspan class="mf"><tspan class="it">P</tspan>(<tspan class="it">s</tspan>′|<tspan class="it">s</tspan>,<tspan class="it">a</tspan>)</tspan> environment transition</text>

        <line x1="17" y1="126" x2="34" y2="126" stroke="#E98FA9" stroke-width="7" stroke-linecap="round"/>
        <polygon points="52,126 33,117 33,135" fill="#E98FA9" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/>
        <text x="60" y="132">optimal action</text>

        <text class="k num prob" x="33" y="162">0.8</text>
        <text x="60" y="162"><tspan class="mf"><tspan class="it">P</tspan>(<tspan class="it">s</tspan>′|<tspan class="it">s</tspan>,<tspan class="it">a</tspan>)</tspan> probability</text>

        <text class="k num rew" x="33" y="192">+2</text>
        <text x="60" y="192">reward <tspan class="mf"><tspan class="it">r</tspan>(<tspan class="it">s</tspan>,<tspan class="it">a</tspan>,<tspan class="it">s</tspan>′)</tspan></text>
      </g>

    </svg>

    <div id="calc">
      <button class="x" id="calcClose" aria-label="Close">×</button>
      <div id="calcBody"></div>
    </div>
  </div>


  <div id="sbsPanel">
    <div class="sbs-head">
      <div class="sbs-ctl sbs-mode">
        <button id="sbsModeSubs" class="on">value computation</button>
        <button id="sbsModeIter">value iteration</button>
      </div>
      <div class="sbs-ctl">
        <button id="sbsPrev" title="назад">◀</button>
        <button id="sbsNext" title="вперёд">▶</button>
        <button id="sbsReset" title="с нуля">⟲</button>
        <button id="sbsEnd" title="до сходимости">⏭</button>
      </div>
      <div class="sbs-phase" id="sbsPhase"></div>
      <div class="sbs-delta" id="sbsDelta"></div>
    </div>
    <div class="sbs-law" id="sbsLaw"></div>
    <div class="sbs-rows" id="sbsGrid"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var gamma = 0.9;                 /* меняется полем в шапке */
  var SVGNS = 'http://www.w3.org/2000/svg';

  /* ======== states ======== */
  var N = {
    'A'   :{x:95,  y:505, rx:65, ry:40, tilt:-2.5},
    'B'   :{x:252, y:264, rx:64, ry:39, tilt: 2  },
    'C'   :{x:518, y:99,  rx:63, ry:38, tilt:-1.5},
    'D'   :{x:433, y:505, rx:65, ry:40, tilt: 2.5},
    'E'   :{x:637, y:274, rx:64, ry:39, tilt:-2  },
    'F'   :{x:752, y:505, rx:63, ry:38, tilt: 1.5},
    'G'   :{x:920, y:330, rx:65, ry:40, tilt:-1.5},
    'cake'   :{x:1035,y:80,  rx:60, ry:58, terminal:true, rIn:20},
    'cupcake':{x:1035,y:505, rx:50, ry:60, terminal:true, rIn:3}  /* под тортом, вровень с F */
  };
  var CAKE_SCALE=0.2, CUP_SCALE=0.16;   /* рисунки 1024×1024 → узлы графа */

  /* ======== actions ========
     dot — the point where the agent's choice ends and the environment takes over
     lo  — which side of the blue line carries α/β (π(a|s) goes on the other side) */
  var ACT = [
    {id:'A_a', s:'A', act:'α', dot:{x:158,y:395}, so:-10, lo:-18,
      out:[{to:'B', r:0, p:1, off:-10}]},
    {id:'A_b', s:'A', act:'β', dot:{x:242,y:519}, so: 10, lo: 18,
      out:[{to:'D', r:1, p:1, off:12, ro:13}]},

    {id:'B_a', s:'B', act:'α', dot:{x:351,y:178}, so:-10, lo:-18,
      out:[{to:'C', r:0, p:1, off:-10}]},
    {id:'B_b', s:'B', act:'β', dot:{x:398,y:273}, so: 12, lo: 18,
      out:[{to:'E', r:2, p:1, off:10, ro:-13}]},

    {id:'C_a', s:'C', act:'α', dot:{x:663,y:82}, so:-8, lo:-18,
      out:[{to:'cake', r:20, p:1, off:-8, ro:-14}]},

    {id:'D_a', s:'D', act:'α', dot:{x:473,y:386}, so:-8, lo:-18,
      out:[{to:'E', r:1, p:1, off:-8, ro:13}]},
    {id:'D_b', s:'D', act:'β', dot:{x:583,y:507}, so:  8, lo: 20, stoch:true,
      out:[{to:'F', r:0, p:0.8, off:10, po: 19, pt:.16},   /* под своей стрелкой */
           {to:'E', r:0, p:0.2, off:74, po:-21, pt:.16}]}, /* слева от своей стрелки */

    {id:'E_a', s:'E', act:'α', dot:{x:761,y:212}, so:-8, lo:-18,
      out:[{to:'cake', r:20, p:1, off:-8, ro:-14}]},

    {id:'F_a', s:'F', act:'α', dot:{x:837,y:408}, so:-8, lo:-18, pit:.88,
      out:[{to:'G', r:-10, p:1, off:8, ro:-21, rt:.30}]},
    /* the consolation cupcake: a small reward right now instead of the long way through G */
    {id:'F_b', s:'F', act:'β', dot:{x:900,y:505}, so: 8, lo: 18, pit:.86,
      out:[{to:'cupcake', r:3, p:1, off:8, ro:15, rt:.45}]},

    /* G: the agent takes α, but the environment keeps it in place with p = 0.5 (+5).
       For the loop, off is the bulge radius: a positive sign puts it left of G */
    {id:'G_a', s:'G', act:'α', dot:{x:962,y:209}, so:10, lo:-20, stoch:true,
      out:[{to:'cake', r:20, p:0.5, off:8, po:20, pt:.34, ro:-22, rt:.34},
           {to:'G',    r:5,  p:0.5, off:132, po:27, pt:.24, ro:22, rt:.72}]}
  ];

  var perState = {};
  ACT.forEach(function(a){ (perState[a.s] = perState[a.s] || []).push(a); });
  ACT.forEach(function(a){ a.piRand = 1/perState[a.s].length; });

  function Q(a,V){
    var q=0;
    a.out.forEach(function(o){ q += o.p*(o.r + gamma*V[o.to]); });
    return q;
  }
  /* the loop in G makes this cyclic, so values are solved iteratively */
  function solve(optimal){
    var V={}, k;
    for(k in N) V[k]=0;
    for(var i=0;i<3000;i++){
      var nv={};
      for(k in N){
        if(N[k].terminal){ nv[k]=0; continue; }
        var acts=perState[k], qs=acts.map(function(a){ return Q(a,V); });
        nv[k] = optimal ? Math.max.apply(null,qs)
                        : qs.reduce(function(s,q,j){ return s + acts[j].piRand*q; },0);
      }
      V=nv;
    }
    return V;
  }
  var VPI = solve(false), VOPT = solve(true), OPT = {};

  /* оптимальная политика задаёт действие в каждом состоянии: где выбора нет,
     единственное действие и есть оптимальное */
  function computeOpt(){
    var best={}, k;
    for(k in perState){
      var acts=perState[k], b=acts[0];
      acts.forEach(function(a){ if(Q(a,VOPT) > Q(b,VOPT)+1e-9) b=a; });
      best[k]=b;
    }
    OPT={};
    ACT.forEach(function(a){ OPT[a.id] = (best[a.s]===a); });
  }
  computeOpt();

  function fmt(v){ return String(Math.round(v*1000)/1000).replace('-','\u2212'); }
  function tsp(parent,text,attrs){ var t=mk('tspan',attrs||{},parent); t.textContent=text; return t; }
  function setV(el,k,star){
    while(el.firstChild) el.removeChild(el.firstChild);
    tsp(el,'V',{'class':'it'});
    if(N[k].terminal){ tsp(el,'('+k+') = '); tsp(el,'0',{'class':'num'}); return; }
    tsp(el, star?'\u2217':'π', {'class':star?'sup':'sup it', dy:-7});
    tsp(el,' = ',{dy:7});
    tsp(el, fmt(star?VOPT[k]:VPI[k]), {'class':'num'});
  }
  function setPi(el,val){
    while(el.firstChild) el.removeChild(el.firstChild);
    tsp(el,'π',{'class':'it'});
    tsp(el,' = ');
    tsp(el,val,{'class':'num'});
  }
  function signed(v){ return (v>0?'+':'')+fmt(v); }
  function r1(v){ return Math.round(v*10)/10; }

  /* набор формул «под LaTeX»: переменные курсивом, индексы надстрочными */
  function IT(x){ return '<i>'+x+'</i>'; }
  function SUB_(base,sup,arg){
    return IT(base)+'<sup>'+sup+'</sup>'+(arg?'('+IT(arg)+')':'');
  }
  function Vpi(arg){ return SUB_('V','π',arg); }
  function Vst(arg){ return SUB_('V','&#8727;',arg); }
  function Qpi(arg){ return SUB_('Q','π',arg); }
  function Qst(arg){ return SUB_('Q','&#8727;',arg); }

  /* ======== geometry ======== */
  function border(o,tx,ty,pad){
    var dx=tx-o.x, dy=ty-o.y, l=Math.hypot(dx,dy)||1;
    dx/=l; dy/=l;
    if(o.rx===undefined) return {x:o.x+dx*(8+pad), y:o.y+dy*(8+pad)};
    var rx=o.rx+pad, ry=o.ry+pad;
    var t=1/Math.sqrt((dx/rx)*(dx/rx)+(dy/ry)*(dy/ry));
    return {x:o.x+dx*t, y:o.y+dy*t};
  }
  function curve(from,to,off,padA,padB){
    var dx=to.x-from.x, dy=to.y-from.y, l=Math.hypot(dx,dy)||1;
    var nx=-dy/l, ny=dx/l;
    var c={x:(from.x+to.x)/2+nx*off, y:(from.y+to.y)/2+ny*off};
    var s=border(from,c.x,c.y,padA), e=border(to,c.x,c.y,padB);
    /* Вторая итерация: контрольную точку ставим на середину ВИДИМОЙ части.
       Иначе у коротких стрелок она уползает почти на конец кривой, касательная
       в конце вырождается и наконечник смотрит вбок. Заодно ослабляем изгиб
       у совсем коротких стрелок, чтобы дуга не превращалась в крючок. */
    var vl=Math.hypot(e.x-s.x,e.y-s.y)||1;
    var k=Math.max(.35,Math.min(1,vl/130));
    c={x:(s.x+e.x)/2+nx*off*k, y:(s.y+e.y)/2+ny*off*k};
    s=border(from,c.x,c.y,padA); e=border(to,c.x,c.y,padB);
    return {s:s,c:c,e:e,nx:nx,ny:ny,
            d:'M'+r1(s.x)+' '+r1(s.y)+' Q'+r1(c.x)+' '+r1(c.y)+' '+r1(e.x)+' '+r1(e.y)};
  }
  /* "stay in place": a round cubic arc on one side of the state */
  function selfLoop(a,o){
    var A=a.dot, B=N[a.s];
    /* Петля задаётся направлениями выхода и входа, а не изгибом хорды:
       так конец кривой приходит в состояние ровно по заданному лучу
       (для G — в левый верхний угол) и наконечник ложится по линии. */
    var v=o.exit||[-.98,-.2], w=o.enter||[-.707,-.707];
    var s=border(A, A.x+v[0]*300, A.y+v[1]*300, 5);
    var e=border(B, B.x+w[0]*300, B.y+w[1]*300, 14);
    var c1={x:s.x+v[0]*o.off*.72, y:s.y+v[1]*o.off*.72};
    var c2={x:e.x+w[0]*o.off*.56, y:e.y+w[1]*o.off*.56};
    var dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1;
    var nx=-dy/L, ny=dx/L;
    return {s:s, e:e, c1:c1, c2:c2, c:{x:(c1.x+c2.x)/2,y:(c1.y+c2.y)/2}, nx:nx, ny:ny,
            d:'M'+r1(s.x)+' '+r1(s.y)+' C'+r1(c1.x)+' '+r1(c1.y)+' '+
              r1(c2.x)+' '+r1(c2.y)+' '+r1(e.x)+' '+r1(e.y)};
  }
  function at(g,t){
    var u=1-t;
    if(g.c1) return {x:u*u*u*g.s.x+3*u*u*t*g.c1.x+3*u*t*t*g.c2.x+t*t*t*g.e.x,
                     y:u*u*u*g.s.y+3*u*u*t*g.c1.y+3*u*t*t*g.c2.y+t*t*t*g.e.y};
    return {x:u*u*g.s.x+2*u*t*g.c.x+t*t*g.e.x, y:u*u*g.s.y+2*u*t*g.c.y+t*t*g.e.y};
  }
  function off(g,t,d){ var p=at(g,t); return {x:p.x+g.nx*d, y:p.y+g.ny*d}; }

  function mk(tag,attrs,parent){
    var el=document.createElementNS(SVGNS,tag);
    for(var k in attrs) if(attrs[k]!==undefined&&attrs[k]!==null) el.setAttribute(k,attrs[k]);
    if(parent) parent.appendChild(el);
    return el;
  }

  var gChains=document.getElementById('gChains'),
      gNodes =document.getElementById('gNodes'),
      gValues=document.getElementById('gValues'),
      cakeArt=document.getElementById('cakeArt'),
      cupcakeArt=document.getElementById('cupcakeArt');

  /* ======== chains: state → action → outcomes ======== */
  var chainEls={}, rewEls=[], probEls={}, piEls=[], envEls={}, segEls={}, actLbl={};
  var CH={}, byId={};

  ACT.forEach(function(a){
    byId[a.id]=a;
    var g=mk('g',{'class':'chain'},gChains);
    chainEls[a.id]=g;
    var R={a:a, outs:[]};
    CH[a.id]=R;

    R.seg   =mk('path',{'class':'seg'},g);
    R.segHit=mk('path',{'class':'hit'},g);
    segEls[a.id]=R.seg;

    a.out.forEach(function(o,i){
      var r={o:o};
      r.path=mk('path',{'class':'env','marker-end':'url(#ah)'},g);
      r.hit =mk('path',{'class':'hit'},g);
      o._el=r.path;
      (envEls[a.id]=envEls[a.id]||[]).push(r.path);
      bindEnv(r.hit,a,o); bindEnv(r.path,a,o);
      if(o.r){
        r.rew=mk('text',{'class':'rlabel'},g);
        r.rew.textContent=signed(o.r);
        rewEls.push(r.rew);
      }
      if(a.stoch){
        r.prob=mk('text',{'class':'plabel'},g);
        r.prob.textContent=String(o.p);
        probEls[a.id+'_'+i]=r.prob;
      }
      R.outs.push(r);
    });

    R.tri=mk('polygon',{'class':'dot'},g);
    R.lbl=mk('text',{'class':'alabel'},g);
    R.lbl.textContent=a.act;
    actLbl[a.id]=R.lbl;
    R.triHit=mk('circle',{r:15,fill:'transparent'},g);
    R.triHit.style.cursor='pointer';
    bindAct(R.triHit,a); bindAct(R.segHit,a); bindAct(R.seg,a);

    if(perState[a.s].length>1){
      R.pi=mk('text',{'class':'pilabel fade'},g);
      piEls.push({el:R.pi, a:a});
    }
    R.q=mk('text',{'class':'qlabel'},g);   /* ценность действия — на острие */
  });

  /* ======== states ======== */
  var nodeEls={}, NODE={}, vpiEls=[], vstEls=[];
  Object.keys(N).forEach(function(k){
    var n=N[k], R={};
    NODE[k]=R;
    if(!n.terminal){
      var g=mk('g',{'class':'node'},gNodes);
      R.oval=mk('ellipse',{'class':'oval',rx:n.rx,ry:n.ry},g);
      R.txt =mk('text',{'class':'stlabel'},g);
      R.txt.textContent=k;
      nodeEls[k]=g;
      bindNode(g,k);
    }
    var vcls=n.terminal?'':' inside';
    R.vpi=mk('text',{'class':'vlabel pi fade'+vcls}, n.terminal?gValues:nodeEls[k]);
    R.vst=mk('text',{'class':'vlabel star fade'+vcls}, n.terminal?gValues:nodeEls[k]);
    setV(R.vpi,k,false); setV(R.vst,k,true);
    vpiEls.push(R.vpi); vstEls.push(R.vst);
  });
  bindNode(document.getElementById('cakeHit'),'cake');
  bindNode(document.getElementById('cupcakeHit'),'cupcake');
  var halo =mk('ellipse',{'class':'halo',rx:N['D'].rx+9,ry:N['D'].ry+9},gNodes);
  var halo2=mk('ellipse',{'class':'halo',rx:N['G'].rx+9,ry:N['G'].ry+9},gNodes);

  /* ======== geometry pass ======== */
  function layout(){
    ACT.forEach(function(a){
      var R=CH[a.id];
      var gs=curve(N[a.s],a.dot,a.so,5,1);
      a._gs=gs;
      R.seg.setAttribute('d',gs.d);
      R.segHit.setAttribute('d',gs.d);

      var ux=gs.e.x-gs.c.x, uy=gs.e.y-gs.c.y, ul=Math.hypot(ux,uy)||1;
      ux/=ul; uy/=ul;
      var P=a.dot;
      R.tri.setAttribute('points',[
        [P.x+ux*12,     P.y+uy*12],
        [P.x-ux*7-uy*9, P.y-uy*7+ux*9],
        [P.x-ux*7+uy*9, P.y-uy*7-ux*9]
      ].map(function(p){ return r1(p[0])+','+r1(p[1]); }).join(' '));
      R.triHit.setAttribute('cx',P.x);
      R.triHit.setAttribute('cy',P.y);

      var lp=off(gs, a.lt===undefined?.40:a.lt, a.lo*1.15);
      R.lbl.setAttribute('x',r1(lp.x)); R.lbl.setAttribute('y',r1(lp.y));
      var pm=off(gs, a.pit===undefined?.84:a.pit, -a.lo*1.15);
      if(R.pi){ R.pi.setAttribute('x',r1(pm.x)); R.pi.setAttribute('y',r1(pm.y)); }
      R.q.setAttribute('x',r1(pm.x)); R.q.setAttribute('y',r1(pm.y));

      R.outs.forEach(function(r){
        var o=r.o;
        /* конец пути отодвинут на 16: кончик наконечника выступает вперёд и
           встаёт примерно там, где раньше заканчивалась линия */
        var ge=(o.to===a.s) ? selfLoop(a,o) : curve(a.dot, N[o.to], o.off, 5, 16);
        o._g=ge;
        r.path.setAttribute('d',ge.d);
        r.hit.setAttribute('d',ge.d);
        if(r.rew){
          var pr=off(ge, o.rt===undefined?.5:o.rt, o.ro===undefined?13:o.ro);
          r.rew.setAttribute('x',r1(pr.x)); r.rew.setAttribute('y',r1(pr.y));
        }
        if(r.prob){
          /* the probability sits right after the branching point */
          var pp=off(ge, o.pt===undefined?.18:o.pt, o.po===undefined?13:o.po);
          r.prob.setAttribute('x',r1(pp.x)); r.prob.setAttribute('y',r1(pp.y));
        }
      });
    });

    Object.keys(N).forEach(function(k){
      var n=N[k], R=NODE[k];
      if(R.oval){
        R.oval.setAttribute('cx',r1(n.x)); R.oval.setAttribute('cy',r1(n.y));
        R.oval.setAttribute('transform','rotate('+n.tilt+' '+r1(n.x)+' '+r1(n.y)+')');
        R.txt.setAttribute('x',r1(n.x)); R.txt.setAttribute('y',r1(n.y+1));
      }
      var vx=n.x, vy=n.y+19;                    /* ценность — внутри овала, под буквой */
      if(k==='cake'){ vx=n.x+98; vy=n.y-52; }   /* сбоку: сверху вишенка, слева стрелки */
      if(k==='cupcake'){ vy=n.y-n.ry-24; }
      [R.vpi,R.vst].forEach(function(t){ t.setAttribute('x',r1(vx)); t.setAttribute('y',r1(vy)); });
    });

    [['D',halo],['G',halo2]].forEach(function(p){
      p[1].setAttribute('cx',r1(N[p[0]].x)); p[1].setAttribute('cy',r1(N[p[0]].y));
    });
    cakeArt.setAttribute('transform',
      'translate('+r1(N.cake.x-512*CAKE_SCALE)+' '+r1(N.cake.y-520*CAKE_SCALE)+') scale('+CAKE_SCALE+')');
    cupcakeArt.setAttribute('transform',
      'translate('+r1(N.cupcake.x-520*CUP_SCALE)+' '+r1(N.cupcake.y-469*CUP_SCALE)+') scale('+CUP_SCALE+')');
  }

  /* ======== tooltips ======== */
  function hl(a,on){
    segEls[a.id].classList.toggle('hover',on);
    actLbl[a.id].classList.toggle('hover',on);
    envEls[a.id].forEach(function(p){ p.classList.toggle('hover',on); });
  }
  function outOf(k){ return perState[k]||[]; }

  function bindNode(el,k){
    el.addEventListener('mouseenter',function(){
      outOf(k).forEach(function(a){ hl(a,true); });
    });
    el.addEventListener('mouseleave',function(){
      outOf(k).forEach(function(a){ hl(a,false); });
    });
    el.addEventListener('click',function(){
      if(SBS.on){
        document.querySelectorAll('.sbs-row').forEach(function(b){ b.classList.toggle('hot', b.dataset.s===k); });
        return;
      }
      openCalc(k);
    });
  }

  function bindAct(el,a){
    el.style.cursor='pointer';
    el.addEventListener('mouseenter',function(){ hl(a,true); });
    el.addEventListener('mouseleave',function(){ hl(a,false); });
  }

  function bindEnv(el,a,o){
    el.addEventListener('mouseenter',function(){ o._el.classList.add('hover'); });
    el.addEventListener('mouseleave',function(){ o._el.classList.remove('hover'); });
  }

  /* ======== calculation panel ======== */
  var DOT='&#8201;&#183;&#8201;';
  function qLine(a,V,star){
    var terms=a.out.map(function(o){
      var inner=fmt(o.r)+' + '+fmt(gamma)+DOT+fmt(V[o.to]);
      return (o.p===1)?'('+inner+')':o.p+DOT+'('+inner+')';
    }).join(' + ');
    return (star?Qst():Qpi())+'('+IT(a.s)+',&#8202;'+IT(a.act)+') = '+terms+' = '+fmt(Q(a,V));
  }
  function blockPi(k){
    var acts=perState[k], L=[];
    acts.forEach(function(a){ L.push(qLine(a,VPI,false)); });
    if(acts.length>1){
      L.push(Vpi(k)+' = '+acts.map(function(a){
        return fmt(a.piRand)+DOT+fmt(Q(a,VPI));
      }).join(' + '));
    }
    return L;
  }
  function blockStar(k){
    var acts=perState[k], L=[], best=null;
    acts.forEach(function(a){ L.push(qLine(a,VOPT,true)); if(OPT[a.id]) best=a; });
    if(acts.length>1){
      L.push(Vst(k)+' = max&#8202;{ '+acts.map(function(a){ return fmt(Q(a,VOPT)); }).join(' ; ')+' }');
    }
    return {lines:L, best:best};
  }

  /* пересобирается при смене γ */
  function calcSpecial(k){
    if(k==='G'){
      var den=1-0.5*gamma;
      var VG=IT('V')+'('+IT('G')+')', g=IT('γ');
      return {sub:'a single action, but the environment keeps the agent in place with '+IT('p')+' = 0.5',
        pi:[VG+' = 0.5'+DOT+'(20 + '+g+DOT+'0) + 0.5'+DOT+'(5 + '+g+DOT+VG+')',
            VG+' = 10 + 2.5 + '+fmt(0.5*gamma)+DOT+VG,
            fmt(den)+DOT+VG+' = 12.5',
            'the loop turns this into an equation — the value cannot be read off top-down'],
        pir:VG+' = 12.5 / '+fmt(den)+' = '+fmt(VPI['G']),
        st:['A single action, so '+Vst('G')+' = '+Vpi('G')],
        str:Vst('G')+' = '+fmt(VOPT['G'])};
    }
    if(N[k].terminal){
      return {sub:'terminal state',
        pi:['The '+signed(N[k].rIn)+' reward is granted for the transition into '+k+',',
            'there are no transitions out of it'],
        pir:IT('V')+'('+k+') = 0',
        st:['The same under the optimal policy'],
        str:IT('V')+'<sup>&#8727;</sup>('+k+') = 0'};
    }
    return null;
  }
  var SUB={
    'A':'the agent chooses '+IT('α')+' (→ '+IT('B')+') or '+IT('β')+' (→ '+IT('D')+')',
    'B':'the agent chooses '+IT('α')+' (→ '+IT('C')+') or '+IT('β')+' (→ '+IT('E')+')',
    'C':'a single action, '+IT('π')+'('+IT('α')+'|'+IT('C')+') = 1',
    'D':IT('α')+' has one outcome, '+IT('β')+' is resolved by the environment: 0.8 / 0.2',
    'E':'a single action, '+IT('π')+'('+IT('α')+'|'+IT('E')+') = 1',
    'F':'grab the cupcake now (+3) or pay \u221210 and push on to '+IT('G')
  };

  var calc=document.getElementById('calc'), calcBody=document.getElementById('calcBody'), picked=null;
  document.getElementById('calcClose').addEventListener('click',closeCalc);

  function openCalc(k){
    var sp=calcSpecial(k), piL, piR, stL, stR, sub;
    if(sp){ piL=sp.pi; piR=sp.pir; stL=sp.st; stR=sp.str; sub=sp.sub; }
    else{
      var st=blockStar(k);
      piL=blockPi(k); piR=Vpi(k)+' = '+fmt(VPI[k]);
      stL=st.lines;
      stR=Vst(k)+' = '+fmt(VOPT[k])+(st.best?'  →  '+IT(st.best.act):'');
      sub=SUB[k]||'';
    }
    if(picked&&nodeEls[picked]) nodeEls[picked].classList.remove('picked');
    picked=k; if(nodeEls[k]) nodeEls[k].classList.add('picked');
    calcBody.innerHTML=
      '<h3>'+(N[k].terminal?k:'State '+IT(k))+'</h3>'+
      '<div class="sub">'+sub+'   ·   '+IT('γ')+' = '+fmt(gamma)+'</div>'+
      '<div class="blk pi"><div class="h">Random policy</div>'+
        piL.map(function(l){ return '<div class="ln">'+l+'</div>'; }).join('')+
        '<div class="ln res">'+piR+'</div></div>'+
      '<div class="blk st"><div class="h">Optimal policy</div>'+
        stL.map(function(l){ return '<div class="ln">'+l+'</div>'; }).join('')+
        '<div class="ln res">'+stR+'</div></div>';
    calc.classList.add('on');
  }
  function closeCalc(){
    calc.classList.remove('on');
    if(picked&&nodeEls[picked]) nodeEls[picked].classList.remove('picked');
    picked=null;
  }


  /* ======== пошаговое вычисление (step-by-step) ======== */

  /* ---- уравнение Беллмана, по которому идёт текущий счёт ---- */
  function renderLaw(){
    var optimal=sbsOptimal(), iter=(MODE==='iter');
    var S=IT('s'), SP=IT('s&prime;'), A=IT('a'), G=IT('γ');
    var P='&sum;<sub>'+SP+'</sub> '+IT('P')+'('+SP+'|'+S+',&#8202;'+A+')';
    var R=IT('r')+'('+S+',&#8202;'+A+',&#8202;'+SP+')';
    var name,qL,vL;
    if(!iter){
      var Vs=optimal?Vst():Vpi(), Qs=optimal?Qst():Qpi();
      qL=Qs+'('+S+',&#8202;'+A+') = '+P+' [ '+R+' + '+G+'&#8201;'+Vs+'('+SP+') ]';
      vL=optimal
        ? Vst()+'('+S+') = max<sub>'+A+'</sub> '+Qst()+'('+S+',&#8202;'+A+')'
        : Vpi()+'('+S+') = &sum;<sub>'+A+'</sub> '+IT('π')+'('+A+'|'+S+')&#8201;'+Qpi()+'('+S+',&#8202;'+A+')';
      name=optimal?'Bellman optimality equations':'Bellman expectation equations';
    } else {
      var Qk=IT('Q')+'<sub>k+1</sub>', Vk=IT('V')+'<sub>k</sub>', Vk1=IT('V')+'<sub>k+1</sub>';
      qL=Qk+'('+S+',&#8202;'+A+') = '+P+' [ '+R+' + '+G+'&#8201;'+Vk+'('+SP+') ]';
      vL=optimal
        ? Vk1+'('+S+') = max<sub>'+A+'</sub> '+Qk+'('+S+',&#8202;'+A+')'
        : Vk1+'('+S+') = &sum;<sub>'+A+'</sub> '+IT('π')+'('+A+'|'+S+')&#8201;'+Qk+'('+S+',&#8202;'+A+')';
      name=optimal?'value iteration':'iterative policy evaluation';
    }
    var qc='eq', vc='eq';
    if(iter){ if(SBS.phase==='Q'){ qc+=' act'; vc+=' dim'; } else { vc+=' act'; qc+=' dim'; } }
    document.getElementById('sbsLaw').innerHTML=
      '<div class="eqs"><div class="'+qc+'">'+qL+'</div><div class="'+vc+'">'+vL+'</div>'+
      '<div class="name">'+name+'</div></div>';
  }
  /* ---- метод 1: прямой расчёт по состояниям (подстановка с конца) ---- */
  var SUBS={order:null, i:0};

  function subsOrder(){
    var known={}, order=[], left=[];
    Object.keys(N).forEach(function(k){ if(N[k].terminal){ known[k]=1; } else left.push(k); });
    order.push(Object.keys(N).filter(function(k){ return N[k].terminal; }));   /* шаг 0 — терминалы */
    var guard=0;
    while(left.length && guard++<40){
      var idx=-1;
      for(var i=0;i<left.length;i++){
        var s=left[i];
        var ready=perState[s].every(function(a){
          return a.out.every(function(o){ return known[o.to] || o.to===s; });
        });
        if(ready){ idx=i; break; }
      }
      if(idx<0) break;
      var s2=left.splice(idx,1)[0];
      known[s2]=1; order.push([s2]);
    }
    left.forEach(function(s){ order.push([s]); });
    return order;
  }

  /* строка вывода для одного состояния; каждое число — токен со скрытым ответом */
  function tok(v,cls){ return '<span class="tok'+(cls?' '+cls:'')+'" data-v="'+v+'">?</span>'; }
  var ROWCTL='<div class="rowctl">'+
    '<button data-a="prev" title="назад">◀</button>'+
    '<button data-a="next" title="открыть следующее">▶</button>'+
    '<button data-a="reset">reset</button>'+
    '<button data-a="all" title="открыть всё">⏭</button></div>';

  function subsCard(s,optimal,hot){
    var V=optimal?VOPT:VPI, cls='sbs-row '+(optimal?'mode-star':'mode-pi')+(hot?' hot':'');
    if(N[s].terminal){
      return '<div class="'+cls+'" data-s="'+s+'"><div class="s term">'+s+'</div><div class="body">'+
             '<span class="note">terminal, no actions</span>'+
             '<span class="v">'+IT('V')+'('+s+') = '+tok('0','res')+'</span></div>'+ROWCTL+'</div>';
    }
    var acts=perState[s], parts=[], selfp=0;
    acts.forEach(function(a){
      a.out.forEach(function(o){ if(o.to===s) selfp+=a.piRand*o.p; });
      var terms=a.out.map(function(o){
        var val=(o.to===s)? IT('V')+'('+IT(s)+')' : tok(fmt(V[o.to]),'from');
        var inner=tok(fmt(o.r))+' + '+fmt(gamma)+DOT+val;
        return (o.p===1)?'('+inner+')':tok(String(o.p))+DOT+'('+inner+')';
      }).join(' + ');
      parts.push('<span class="q">'+(optimal?Qst():Qpi())+'('+IT(s)+',&#8202;'+IT(a.act)+') = '+terms+
                 (selfLoopIn(a,s)?'':' = '+tok(fmt(Q(a,V)),'res'))+'</span>');
    });
    if(selfp>0){
      var C=Math.round(V[s]*(1-gamma*selfp)*1000)/1000;
      parts.push('<span class="q">'+IT('V')+'('+IT(s)+') = '+tok(fmt(C))+' + '+fmt(gamma)+DOT+tok(fmt(selfp))+DOT+
                 IT('V')+'('+IT(s)+')  &rarr;  '+tok(fmt(Math.round((1-gamma*selfp)*1000)/1000))+DOT+
                 IT('V')+'('+IT(s)+') = '+tok(fmt(C))+'</span>'+
                 '<span class="note">the loop makes it an equation</span>');
    } else {
      var rhs = optimal
        ? 'max&#8202;{ '+acts.map(function(a){ return tok(fmt(Q(a,V))); }).join(' ; ')+' }'
        : acts.map(function(a){ return tok(fmt(a.piRand))+DOT+tok(fmt(Q(a,V))); }).join(' + ');
      parts.push('<span class="q">'+(optimal?Vst():Vpi())+'('+IT(s)+') = '+rhs+'</span>');
    }
    parts.push('<span class="v">'+(optimal?Vst():Vpi())+'('+IT(s)+') = '+tok(fmt(V[s]),'res')+'</span>');
    return '<div class="'+cls+'" data-s="'+s+'"><div class="s">'+s+'</div><div class="body">'+
           parts.join('')+'</div>'+ROWCTL+'</div>';
  }

  /* сколько токенов раскрыто в каждой строке */
  var REVEAL={};
  function applyReveal(row){
    var s=row.dataset.s, toks=row.querySelectorAll('.tok'), n=REVEAL[s];
    if(n===undefined) n=0;
    n=Math.max(0,Math.min(toks.length,n));
    for(var i=0;i<toks.length;i++){
      if(i<n){ toks[i].textContent=toks[i].dataset.v; toks[i].classList.add('on'); }
      else { toks[i].textContent='?'; toks[i].classList.remove('on'); }
    }
    row.querySelector('[data-a="prev"]').disabled=(n===0);
    row.querySelector('[data-a="next"]').disabled=(n>=toks.length);
    var V=sbsOptimal()?VOPT:VPI, done=(n>=toks.length);
    if(NODE[s]){
      setVal(NODE[s].vpi,s,false, done?V[s]:null);
      setVal(NODE[s].vst,s,true,  done?V[s]:null);
    }
    /* Q на острие — только для текущего состояния и только когда строка раскрыта */
    var cur=(SUBS.order&&SUBS.order[SUBS.i])||[];
    (perState[s]||[]).forEach(function(a){
      var R=CH[a.id], on=done && cur.indexOf(s)>=0;
      R.q.setAttribute('class','qlabel '+(sbsOptimal()?'star':'pi')+(on?' show':''));
    });
  }
  document.getElementById('sbsGrid').addEventListener('click',function(ev){
    var b=ev.target.closest('.rowctl button'); if(!b) return;
    var row=b.closest('.sbs-row'), s=row.dataset.s, total=row.querySelectorAll('.tok').length;
    var n=REVEAL[s]===undefined?0:Math.min(REVEAL[s],total);
    var a=b.dataset.a;
    REVEAL[s]= a==='next'?n+1 : a==='prev'?n-1 : a==='reset'?0 : total;
    applyReveal(row);
  });
  function selfLoopIn(a,s){ return a.out.some(function(o){ return o.to===s; }); }

  function subsRender(){
    var optimal=sbsOptimal(), V=optimal?VOPT:VPI;
    if(!SUBS.order) SUBS.order=subsOrder();
    var known={}, cur=SUBS.order[SUBS.i]||[];
    for(var i=0;i<=SUBS.i;i++) (SUBS.order[i]||[]).forEach(function(s){ known[s]=1; });

    Object.keys(N).forEach(function(s){
      if(REVEAL[s]===undefined && known[s]) REVEAL[s]=(cur.indexOf(s)>=0)?0:1e9;
      var open=known[s] && REVEAL[s]>0;   /* значение появится, когда строка раскрыта целиком */
      setVal(NODE[s].vpi,s,false, open?V[s]:null);
      setVal(NODE[s].vst,s,true,  open?V[s]:null);
      if(nodeEls[s]) nodeEls[s].classList.toggle('picked', cur.indexOf(s)>=0);
    });
    ACT.forEach(function(a){
      var R=CH[a.id];
      setQ(R.q,a,optimal,Q(a,V));
      R.q.setAttribute('class','qlabel '+(optimal?'star':'pi'));   /* показ решает applyReveal */
      if(R.pi) R.pi.classList.remove('show');
      chainEls[a.id].classList.toggle('opt', optimal && known[a.s] && OPT[a.id]);
    });

    renderLaw();
    var total=SUBS.order.length-1;
    document.getElementById('sbsPhase').innerHTML = (SUBS.i===0)
      ? '<b>Start</b>'
      : '<b>Step '+SUBS.i+' of '+total+'</b>';
    document.getElementById('sbsDelta').innerHTML = (SUBS.i===total) ? 'all values computed' : '';

    var html='';
    for(var j=SUBS.i;j>=0;j--)                     /* свежее — сверху */
      (SUBS.order[j]||[]).forEach(function(s){ html+=subsCard(s,optimal,j===SUBS.i); });
    document.getElementById('sbsGrid').innerHTML=html;
    document.querySelectorAll('#sbsGrid .sbs-row').forEach(applyReveal);
    document.getElementById('sbsPrev').disabled=(SUBS.i===0);
    document.getElementById('sbsNext').disabled=(SUBS.i>=total);
  }


  var SBS={on:false, k:0, phase:'V', opt:null, VK:null};

  function backup(V,optimal){
    var nv={}, k;
    for(k in N){
      if(N[k].terminal){ nv[k]=0; continue; }
      var acts=perState[k], qs=acts.map(function(a){ return Q(a,V); });
      nv[k]= optimal ? Math.max.apply(null,qs)
                     : qs.reduce(function(s,q,j){ return s+acts[j].piRand*q; },0);
    }
    return nv;
  }
  function ensureVK(optimal,upto){
    if(SBS.VK && SBS.opt===optimal){
      while(SBS.VK.length<=upto) SBS.VK.push(backup(SBS.VK[SBS.VK.length-1],optimal));
      return;
    }
    var z={}; for(var k in N) z[k]=0;
    SBS.VK=[z]; SBS.opt=optimal;
    while(SBS.VK.length<=upto) SBS.VK.push(backup(SBS.VK[SBS.VK.length-1],optimal));
  }
  function sbsOptimal(){ return step===5; }

  /* значение в овале с индексом свипа */
  function setVal(el,k,star,val){
    while(el.firstChild) el.removeChild(el.firstChild);
    tsp(el,'V',{'class':'it'});
    if(N[k].terminal){ tsp(el,'('+k+') = '); tsp(el,val===null?'?':fmt(val),{'class':'num'}); return; }
    tsp(el, star?'\u2217':'π', {'class':star?'sup':'sup it', dy:-7});
    tsp(el,' = ',{dy:7});
    tsp(el, val===null?'?':fmt(val), {'class':'num'});
  }
  function setQ(el,a,star,val){
    while(el.firstChild) el.removeChild(el.firstChild);
    tsp(el,'Q',{'class':'it'});
    tsp(el, star?'\u2217':'π', {'class':star?'sup':'sup it', dy:-6});
    tsp(el,' = ',{dy:6});
    tsp(el, fmt(val), {'class':'num'});
  }

  function sbsRender(){
    var optimal=sbsOptimal(), k=SBS.k;
    ensureVK(optimal,k+1);
    var Vshown=SBS.VK[k];
    var Vsrc  =(SBS.phase==='Q') ? SBS.VK[k] : SBS.VK[Math.max(0,k-1)];
    var showQ =(SBS.phase==='Q') || k>0;

    /* овалы */
    Object.keys(N).forEach(function(s){
      setVal(NODE[s].vpi,s,false,Vshown[s]);
      setVal(NODE[s].vst,s,true, Vshown[s]);
    });

    /* остриё: Q, посчитанное из Vsrc */
    var best={};
    Object.keys(perState).forEach(function(s){
      var b=perState[s][0];
      perState[s].forEach(function(a){ if(Q(a,Vsrc)>Q(b,Vsrc)+1e-9) b=a; });
      best[s]=b;
    });
    ACT.forEach(function(a){
      var R=CH[a.id];
      setQ(R.q,a,optimal,Q(a,Vsrc));
      R.q.setAttribute('class','qlabel '+(optimal?'star':'pi')+(showQ?' show':''));
      chainEls[a.id].classList.toggle('opt', optimal && best[a.s]===a);
      if(R.pi) R.pi.classList.remove('show');
    });

    /* формулы под диаграммой */
    renderLaw();
    var head=document.getElementById('sbsPhase'), grid=document.getElementById('sbsGrid');
    var kk=(SBS.phase==='Q')?k+1:k;
    head.innerHTML = (k===0 && SBS.phase==='V')
      ? '<b>Start:</b> <span class="k">V</span><sub>0</sub> = 0 in every state'
      : (SBS.phase==='Q'
         ? '<b>Sweep '+kk+' &middot; step 1:</b> action values <span class="k">Q</span><sub>'+kk+
           '</span></sub> from <span class="k">V</span><sub>'+k+'</sub>'
         : '<b>Sweep '+kk+' &middot; step 2:</b> collapse into <span class="k">V</span><sub>'+kk+'</sub>');

    var d=document.getElementById('sbsDelta');
    if(k>0 && SBS.phase==='V'){
      var mx=0; Object.keys(N).forEach(function(s){ mx=Math.max(mx,Math.abs(SBS.VK[k][s]-SBS.VK[k-1][s])); });
      d.innerHTML='max |&Delta;V| = '+fmt(Math.round(mx*1000)/1000)+(mx<0.01?' &mdash; converged':'');
    } else d.textContent='';

    var mode=optimal?'mode-star':'mode-pi', html='';
    Object.keys(perState).forEach(function(s){
      var acts=perState[s], parts=[];
      acts.forEach(function(a){
        var terms=a.out.map(function(o){
          var inner=fmt(o.r)+' + '+fmt(gamma)+DOT+'<span class="from">'+fmt(Vsrc[o.to])+'</span>';
          return (o.p===1)?'('+inner+')':o.p+DOT+'('+inner+')';
        }).join(' + ');
        parts.push('<span class="q">'+(optimal?Qst():Qpi())+'<sub>'+kk+'</sub>('+IT(s)+',&#8202;'+IT(a.act)+') = '+
                   terms+' = <b>'+fmt(Q(a,Vsrc))+'</b></span>');
      });
      if(SBS.phase==='V' && k>0){
        var rhs = optimal
          ? 'max&#8202;{ '+acts.map(function(a){ return fmt(Q(a,Vsrc)); }).join(' ; ')+' }'
          : acts.map(function(a){ return fmt(a.piRand)+DOT+fmt(Q(a,Vsrc)); }).join(' + ');
        parts.push('<span class="v">'+(optimal?Vst():Vpi())+'<sub>'+kk+'</sub>('+IT(s)+') = '+rhs+' = '+fmt(Vshown[s])+'</span>');
      }
      html+='<div class="sbs-row '+mode+'" data-s="'+s+'"><div class="s">'+s+'</div>'+
            '<div class="body">'+parts.join('')+'</div></div>';
    });
    grid.innerHTML=html;
  }

  var MODE='subs';
  function sbsRenderAny(){ (MODE==='subs')?subsRender():sbsRender(); }
  function sbsStep(dir){
    if(MODE==='subs'){
      var total=(SUBS.order||(SUBS.order=subsOrder())).length-1;
      SUBS.i=Math.max(0,Math.min(total,SUBS.i+dir));
      subsRender(); return;
    }
    if(dir>0){
      if(SBS.phase==='V'){ SBS.phase='Q'; } else { SBS.k++; SBS.phase='V'; }
    } else {
      if(SBS.phase==='Q'){ SBS.phase='V'; }
      else if(SBS.k>0){ SBS.k--; SBS.phase='Q'; }
    }
    document.getElementById('sbsPrev').disabled=(SBS.k===0 && SBS.phase==='V');
    sbsRender();
  }
  function sbsSet(on){
    SBS.on=on;
    document.body.classList.toggle('sbs',on);
    if(on){
      closeCalc();
      if(step<4) setStep(4);
      SBS.VK=null; SBS.k=0; SBS.phase='V'; SUBS.i=0; SUBS.order=null; REVEAL={};
      document.getElementById('sbsPrev').disabled=true;
      document.getElementById('sbsNext').disabled=false;
      sbsRenderAny();
    } else {
      ACT.forEach(function(a){ CH[a.id].q.setAttribute('class','qlabel'); });
      Object.keys(N).forEach(function(s){          /* вернуть сошедшиеся значения */
        setV(NODE[s].vpi,s,false); setV(NODE[s].vst,s,true);
        if(nodeEls[s]) nodeEls[s].classList.remove('picked');
      });
      setStep(step);
    }
  }
  document.getElementById('sbsOn').addEventListener('change',function(){ sbsSet(this.checked); });
  document.getElementById('sbsNext').addEventListener('click',function(){ sbsStep(1); });
  document.getElementById('sbsPrev').addEventListener('click',function(){ sbsStep(-1); });
  document.getElementById('sbsReset').addEventListener('click',function(){
    SBS.k=0; SBS.phase='V'; SUBS.i=0; REVEAL={};
    document.getElementById('sbsPrev').disabled=true;
    document.getElementById('sbsNext').disabled=false;
    sbsRenderAny();
  });
  document.getElementById('sbsEnd').addEventListener('click',function(){
    if(MODE==='subs'){ SUBS.i=(SUBS.order||(SUBS.order=subsOrder())).length-1;
      Object.keys(N).forEach(function(s){ REVEAL[s]=1e9; }); }
    else { SBS.k=40; SBS.phase='V'; }
    document.getElementById('sbsPrev').disabled=false;
    sbsRenderAny();
  });
  function setMode(m){
    MODE=m;
    document.getElementById('sbsModeSubs').classList.toggle('on',m==='subs');
    document.getElementById('sbsModeIter').classList.toggle('on',m==='iter');
    SUBS.i=0; SUBS.order=null; SBS.k=0; SBS.phase='V'; SBS.VK=null; REVEAL={};
    document.getElementById('sbsPrev').disabled=true;
    document.getElementById('sbsNext').disabled=false;
    sbsRenderAny();
  }
  document.getElementById('sbsModeSubs').addEventListener('click',function(){ setMode('subs'); });
  document.getElementById('sbsModeIter').addEventListener('click',function(){ setMode('iter'); });

  /* ======== steps ======== */
  var STEPS=['Graph','Rewards','Stochasticity','Random policy','Optimal policy'];
  var bar=document.getElementById('steps'), btns=[], step=1;
  STEPS.forEach(function(name,i){
    var b=document.createElement('button');
    b.innerHTML='<span class="n">'+(i+1)+'</span>'+name;
    b.addEventListener('click',function(){ setStep(i+1); });
    bar.appendChild(b); btns.push(b);
  });
  function delay(el,ms){ el.style.transitionDelay=ms+'ms'; }

  var SEQ=[['D_b_0',150],['D_b_1',520],['G_a_0',950],['G_a_1',1150]];

  function setStep(n){
    step=n;
    btns.forEach(function(b,i){ b.classList.toggle('on',i+1===n); });

    /* rewards and probabilities stay on screen; their own step just makes them bold */
    rewEls.forEach(function(el){ el.classList.toggle('hot',n===2); });

    var seq=(n===3);
    SEQ.forEach(function(p){
      var el=probEls[p[0]];
      delay(el, seq?p[1]:0);
      el.classList.toggle('hot',seq);
    });

    halo.classList.toggle('show',seq);
    halo2.classList.toggle('show',seq);
    ['D_b','G_a'].forEach(function(id){
      segEls[id].classList.toggle('stoch',seq);
      envEls[id].forEach(function(p){ p.classList.toggle('stoch',seq); });
    });

    /* step 3 dims everything except the two random branch points */
    var focus={'D_b':1,'G_a':1}, focusN={'D':1,'F':1,'E':1,'G':1};
    ACT.forEach(function(a){ chainEls[a.id].classList.toggle('dim',seq&&!focus[a.id]); });
    Object.keys(nodeEls).forEach(function(k){ nodeEls[k].classList.toggle('dim',seq&&!focusN[k]); });

    vpiEls.forEach(function(el){ el.classList.toggle('show',n===4); });
    vstEls.forEach(function(el){ el.classList.toggle('show',n===5); });
    if(SBS.on && n>=4){ SBS.VK=null; SUBS.order=null; setTimeout(sbsRenderAny,0); return; }
    Object.keys(NODE).forEach(function(k){
      if(NODE[k].txt) NODE[k].txt.classList.toggle('up',n>=4);
    });
    piEls.forEach(function(o){
      setPi(o.el,(n===5)?(OPT[o.a.id]?'1':'0'):fmt(o.a.piRand));
      o.el.classList.toggle('show',n>=4);
    });

    ACT.forEach(function(a){ chainEls[a.id].classList.toggle('opt',n===5&&!!OPT[a.id]); });

    if(n<4) closeCalc();
  }

  /* ======== discount factor ======== */
  var gRange=document.getElementById('gammaRange'), gNum=document.getElementById('gammaNum');

  function setGamma(v){
    if(!isFinite(v)) return;
    gamma=Math.min(1,Math.max(0,Math.round(v*100)/100));
    gRange.value=gamma;
    if(document.activeElement!==gNum) gNum.value=gamma;

    VPI=solve(false); VOPT=solve(true);
    computeOpt();
    Object.keys(N).forEach(function(k){
      setV(NODE[k].vpi,k,false); setV(NODE[k].vst,k,true);
    });
    setStep(step);
    if(SBS.on){ SBS.VK=null; SUBS.order=null; sbsRenderAny(); }
    if(picked) openCalc(picked);
  }
  gRange.addEventListener('input',function(){ setGamma(parseFloat(gRange.value)); });
  gNum.addEventListener('input',function(){
    var v=parseFloat(gNum.value);
    if(gNum.value!=='' && isFinite(v)) setGamma(v);
  });
  gNum.addEventListener('blur',function(){ gNum.value=gamma; });

  var st=document.createElement('style');
  st.textContent='.node.dim{opacity:.13;transition:opacity .45s ease}';
  document.head.appendChild(st);

  layout();
  setStep(1);
})();
</script>
</body>
</html>
